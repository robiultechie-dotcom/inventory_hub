  - title: "Semiconductor & Radio Components Vault"
    creator: elena
    category: "Equipment"
    description: "High-precision inventory for microcontrollers, RF modules, voltage tolerances, and **PDF datasheets**."
    image_url: "https://images.unsplash.com/photo-1518770660439-4636190af475?w=600&auto=format&fit=crop&q=80"
    is_public: true
    days_ago: 1
    tags: [hardware, electronics, components, iot]
    custom_id_config:
      - { type: "fixed", value: "PART-", format: "" }
      - { type: "sequence", value: "", format: "D7" }
    fields:
      custom_string1_state: true
      custom_string1_name: "Model"
      custom_string1_desc: "Component part number and description"
      custom_string1_show_in_table: true
      custom_string1_position: 1
      custom_int1_state: true
      custom_int1_name: "Voltage (V)"
      custom_int1_desc: "Nominal operating voltage"
      custom_int1_show_in_table: true
      custom_int1_position: 2
      custom_int2_state: true
      custom_int2_name: "Current (A)"
      custom_int2_desc: "Maximum continuous current in Amps"
      custom_int2_show_in_table: true
      custom_int2_position: 3
      custom_link1_state: true
      custom_link1_name: "Datasheet Link"
      custom_link1_desc: "Official PDF datasheet URL"
      custom_link1_show_in_table: true
      custom_link1_position: 4
    dynamic_fields:
      - { name: "Model", field_type: "string", description: "Component part number and description", show_in_table: true, position: 1, min_length: 2, max_length: 120, legacy_slot_key: "string1" }
      - { name: "Voltage (V)", field_type: "int", description: "Nominal operating voltage (0–100V)", show_in_table: true, position: 2, min_value: 0, max_value: 100, legacy_slot_key: "int1" }
      - { name: "Current (A)", field_type: "int", description: "Maximum continuous current in Amps", show_in_table: true, position: 3, min_value: 0, max_value: 50, legacy_slot_key: "int2" }
      - { name: "Datasheet Link", field_type: "link", description: "Official PDF datasheet URL", show_in_table: true, position: 4, legacy_slot_key: "link1" }
