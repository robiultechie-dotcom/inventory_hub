default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "postgres" } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>

development:
  <<: *default
  database: inventory_hub_development

test:
  <<: *default
  database: inventory_hub_test

production:
  primary: &primary_production
    <<: *default
    database: inventory_hub_production
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *primary_production
    database: inventory_hub_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: inventory_hub_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: inventory_hub_production_cable
    migrations_paths: db/cable_migrate